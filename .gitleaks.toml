# Правила gitleaks по умолчанию + исключения для заведомо вымышленных тестовых значений.
[extend]
useDefault = true

[allowlist]
description = "Вымышленные значения из тестов и примеров"
regexes = [
  '''123456:ABCDEFGHIJKLMNOPQRSTUV''',
  '''abcdefghijklmnop1234''',
  '''\+995 555 00 00 00''',
  # заведомо вымышленные «токены» в тесте маскирования логов
  '''123456789:A{20,}''',
  '''123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi''',
]
