name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, build, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bot_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bot_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # версия pnpm берётся из packageManager в package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Для тестов скриптов бэкапа нужны age и клиент PostgreSQL (pg_dump/psql).
      - name: System tools for backup tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm webapp:build
      - run: pnpm prisma migrate deploy
      - run: pnpm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Падаем на уязвимостях уровня high и выше в продовых зависимостях.
      - run: pnpm audit --prod --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # вся история: секрет, удалённый позже, всё равно остаётся в коммитах
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
