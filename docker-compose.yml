services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # только локально, для разработки
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bot}
      # Бот читает «сердцебиение» бэкапов (только чтение) и оповещает админа, если бэкап не делается
      BACKUP_DIR: /backups
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-3000}:3000"
    volumes:
      - ./backups:/backups:ro

  # Ежедневный бэкап: pg_dump -> gzip -> шифрование age (публичным ключом) -> ./backups, ротация и копия наружу (rclone).
  # Приватный ключ age на сервере НЕ хранится. Результат («сердцебиение») читает бот и оповещает админа, если бэкап не делается.
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Секреты бэкапов (ключ age, доступ к внешнему хранилищу) — в отдельном файле backup.env: приложение их не получает.
    # Нужен Docker Compose >= 2.24 (required: false).
    env_file:
      - path: ./backup.env
        required: false
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-bot}
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: ${TIMEZONE:-Europe/Moscow}
    volumes:
      - ./backups:/backups

  # HTTPS через Caddy (сертификат выпускается сам). Нужен для webhook-режима и для Mini App (Telegram требует https):
  #   docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https", "webhook"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  caddy_data:
